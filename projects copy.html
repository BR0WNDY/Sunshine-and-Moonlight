<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects James & Lilly Potter : Sunshine and Moonlights</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        #sorting-hat-game {
            max-width: 600px;
            margin: 30px auto;
            border: 2px solid #4a4a4a;
            border-radius: 12px;
            background-color: #f4f4f9;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #game-header {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        #game-output {
            background-color: #1a1a1a;
            color: #d4af37; /* Wizarding Gold */
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #333;
            line-height: 1.5;
            font-size: 14px;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #start-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #player-name {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60%;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }

        #btn-start { background-color: #740001; color: #eeba30; } /* Gryffindor colors */
        #btn-start:hover { background-color: #ae0001; }

        #choice-buttons {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .choice-btn {
            background-color: #222f5b; /* Ravenclaw Blue */
            color: white;
            text-align: left;
            border-left: 5px solid transparent;
        }
        .choice-btn:hover { 
            background-color: #0e1a40; 
            border-left: 5px solid #be0002;
            transform: translateX(5px);
        }

        #game-output::-webkit-scrollbar { width: 8px; }
        #game-output::-webkit-scrollbar-track { background: #1a1a1a; }
        #game-output::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .house-gryffindor { color: #ff2400; font-weight: bold; }
        .house-slytherin { color: #2a7e19; font-weight: bold; }
        .house-ravenclaw { color: #222f5b; font-weight: bold; }
        .house-hufflepuff { color: #ecb939; font-weight: bold; }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo-text">Project Sunshine and Moonlights</div>
        <ul class="menu">
            <li class="menu-item"><a href="index.html">Home</a></li>
            <li class="menu-item"><a href="soon2.html">Coming Soon</a></li>
            <li class="menu-item"><a href="projects.html">Projects</a></li>
            <li class="menu-item"><a href="blog.html">Blog</a></li>
            <li class="menu-item"><a href="about.html">About</a></li>
        </ul>
    </nav>

    <div class="projects-layout">
        <h1 style="text-align: center; margin-top: 20px;">Welcome to my Projects</h1>
        <p style="text-align: center;"><strong>Project Sunshine and Moonlights : Sorting Hat Beta 1</strong></p>
        
        <div id="sorting-hat-game">
            <h2 id="game-header">The Sorting Ceremony</h2>
            
            <div id="game-output">
                --- Welcome to Hogwarts ---<br>
                Professor McGonagall is waiting. <br><br>
                Enter your name below to begin.
            </div>

            <div class="controls-area">
                <div id="start-controls">
                    <input type="text" id="player-name" placeholder="Enter your name...">
                    <button id="btn-start" onclick="startGame()">Put on the Hat</button>
                </div>

                <div id="choice-buttons">
                    <button class="choice-btn" onclick="makeChoice('A')" id="btn-A">A</button>
                    <button class="choice-btn" onclick="makeChoice('B')" id="btn-B">B</button>
                    <button class="choice-btn" onclick="makeChoice('C')" id="btn-C">C</button>
                    <button class="choice-btn" onclick="makeChoice('D')" id="btn-D">D</button>
                    <button class="choice-btn" onclick="makeChoice('E')" id="btn-E">E</button>
                </div>
            </div>
        </div>
    </div>

<script>
    class House {
        constructor(name) {
            this.name = name;
            this.assignedHouse = "Unsorted";
            this.gryffindor = 0;
            this.ravenclaw = 0;
            this.hufflepuff = 0;
            this.slytherin = 0;
            this.muggle = 0;
            this.forceMuggle = false;
        }

        sortIntoHouse() {
            if (this.forceMuggle) {
                this.assignedHouse = "Muggle";
                return;
            }
            const scores = {
                "Gryffindor": this.gryffindor,
                "Ravenclaw": this.ravenclaw,
                "Hufflepuff": this.hufflepuff,
                "Slytherin": this.slytherin,
                "Muggle": this.muggle
            };
            this.assignedHouse = Object.keys(scores).reduce((a, b) => scores[a] >= scores[b] ? a : b);
        }
    }

    let player;
    let currentStep = 0;
    const outputDiv = document.getElementById('game-output');
    const startControls = document.getElementById('start-controls');
    const choiceButtons = document.getElementById('choice-buttons');
    const buttons = {
        A: document.getElementById('btn-A'),
        B: document.getElementById('btn-B'),
        C: document.getElementById('btn-C'),
        D: document.getElementById('btn-D'),
        E: document.getElementById('btn-E')
    };

    function print(text, color = "") {
        const span = color ? `<span style="color:${color}">${text}</span>` : text;
        outputDiv.innerHTML += span + "<br>";
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    function startGame() {
        const nameInput = document.getElementById('player-name').value;
        if (!nameInput.trim()) { alert("The Hat needs a name!"); return; }
        player = new House(nameInput);
        startControls.style.display = 'none';
        choiceButtons.style.display = 'flex';
        outputDiv.innerHTML = "";
        print(`--- The Hat is placed on ${player.name}'s head ---`, "#d4af37");
        currentStep = 1;
        loadQuestion(currentStep);
    }

    function loadQuestion(step) {
        Object.values(buttons).forEach(b => b.style.display = 'block');
        print(`<br><strong>Question ${step} of 10</strong>`);

        switch(step) {
            case 1:
                print("Which trait do you value most?");
                updateButtons("A) Bravery", "B) Wisdom", "C) Loyalty", "D) Ambition", "E) Stop talking to me, Hat!");
                break;
            case 2:
                print("Where are you most likely to be found?");
                updateButtons("A) Facing danger", "B) In the library", "C) Helping others", "D) Plotting success", "E) In the detention hall");
                break;
            case 3:
                print("What kind of friend are you?");
                updateButtons("A) Protector", "B) Thinker", "C) Supporter", "D) Motivator", "E) A loner");
                break;
            case 4:
                print("How do you brush your teeth?");
                updateButtons("A) Bravely (no brush)", "B) While reading", "C) Making a snack", "D) With luxury", "E) Normally...");
                break;
            case 5:
                print("Favorite subject?");
                updateButtons("A) DADA", "B) Charms", "C) Herbology", "D) Dark Arts", "E) Math (Muggle)");
                break;
            case 6:
                print("Dream Job?");
                updateButtons("A) Auror", "B) Professor", "C) Mediwizard", "D) CEO/Rich", "E) Shopkeeper");
                break;
            case 7:
                print("A mysterious glowing door appears...");
                updateButtons("A) Open it!", "B) Study it", "C) Get help", "D) Claim it", "E) Walk away");
                break;
            case 8:
                print("Where are you found (again)?");
                updateButtons("A) Quidditch pitch", "B) Astronomy tower", "C) Kitchens", "D) Dungeons", "E) The exit");
                break;
            case 9:
                print("You find a bag of Galleons...");
                updateButtons("A) Return it", "B) Track owner", "C) Wait there", "D) Keep a bit", "E) Run away");
                break;
            case 10:
                print("Which path calls to you?");
                updateButtons("A) The Forest", "B) The River", "C) The Void", "", "");
                buttons.D.style.display = 'none';
                buttons.E.style.display = 'none';
                break;
        }
    }

    function updateButtons(a, b, c, d, e) {
        buttons.A.innerText = a; buttons.B.innerText = b; buttons.C.innerText = c;
        buttons.D.innerText = d; buttons.E.innerText = e;
    }

    function makeChoice(choice) {
        print(`> You chose ${choice}`, "#888");
        if (currentStep < 10) {
            if (choice === 'A') player.gryffindor++;
            else if (choice === 'B') player.ravenclaw++;
            else if (choice === 'C') player.hufflepuff++;
            else if (choice === 'D') player.slytherin++;
            else { player.forceMuggle = true; player.muggle++; }
        } else {
            if (choice === 'A') { player.gryffindor++; player.ravenclaw++; }
            else if (choice === 'B') { player.hufflepuff++; player.slytherin++; }
            else player.forceMuggle = true;
        }

        currentStep++;
        if (currentStep > 10) finishGame();
        else loadQuestion(currentStep);
    }

    function finishGame() {
        choiceButtons.style.display = 'none';
        player.sortIntoHouse();
        print("<br>" + "=".repeat(20));
        
        if (player.assignedHouse === "Muggle") {
            print("The Hat sighs... <strong>MUGGLE!</strong>", "#ff4444");
            print("Return to the train, please.");
        } else {
            const colors = {Gryffindor: "#ae0001", Slytherin: "#2a7e19", Ravenclaw: "#222f5b", Hufflepuff: "#ecb939"};
            print(`The Hat roars: <strong style="font-size:18px">${player.assignedHouse.toUpperCase()}!</strong>`, colors[player.assignedHouse]);
            print(`Welcome home, ${player.name}.`);
        }
        
        outputDiv.innerHTML += `<br><button onclick="location.reload()" style="background:#444; color:white;">Try Again</button>`;
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }
</script>
</body>
</html>
